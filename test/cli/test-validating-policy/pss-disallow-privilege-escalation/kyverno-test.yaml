apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pss-disallow-privilege-escalation
policies:
- policy.yaml
resources:
- resources.yaml
results:
- isValidatingPolicy: true
  kind: Pod
  policy: disallow-privilege-escalation
  resources:
  - linux-escalation-unset
  - linux-escalation-true
  - linux-os-name-escalation-unset
  - linux-init-escalation-unset
  result: fail
- isValidatingPolicy: true
  kind: Pod
  policy: disallow-privilege-escalation
  resources:
  - linux-escalation-false
  - windows-escalation-unset
  result: pass
