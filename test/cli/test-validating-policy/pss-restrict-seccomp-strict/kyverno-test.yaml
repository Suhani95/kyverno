apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pss-restrict-seccomp-strict
policies:
- policy.yaml
resources:
- resources.yaml
results:
- isValidatingPolicy: true
  kind: Pod
  policy: restrict-seccomp-strict
  resources:
  - linux-seccomp-unset
  - linux-pod-seccomp-unconfined
  - linux-container-seccomp-unconfined
  result: fail
- isValidatingPolicy: true
  kind: Pod
  policy: restrict-seccomp-strict
  resources:
  - linux-container-seccomp-runtime-default
  - linux-pod-seccomp-runtime-default
  - windows-seccomp-unset
  result: pass
